<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Secret for Shreyu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <header>
        <div class="carnation-wrapper">
            <div class="carnation"></div>
            <div class="carnation"></div>
            <div class="carnation"></div>
            <div class="carnation"></div>
            <div class="carnation"></div>
            <div class="carnation"></div>
            <div class="carnation"></div>
            <div class="carnation"></div>
        </div>
        <h1>A Little Secret for Shreyu 😈</h1>
    </header>

    <main>
        <section class="hero">
            <p>Hey Shreyu, Puchku made this for you! Enter the secret message and key below to reveal it.</p>
            <!-- Subtle Carnation Graphic will be handled by CSS -->
        </section>

        <section class="decryption-tool">
            <h2>Decrypt Message</h2>
            <div class="input-group">
                <label for="encodedText">Encoded Text:</label>
                <textarea id="encodedText" rows="5" placeholder="Enter the secret message here..."></textarea>
            </div>
            <div class="input-group">
                <label for="secretKey">Secret Key:</label>
                <input type="text" id="secretKey" placeholder="Enter the secret key...">
            </div>
            <button id="decryptButton">Decrypt</button>
            <div class="output-group">
                <label for="outputText">Revealed Message:</label>
                <textarea id="outputText" rows="5" readonly placeholder="Your decrypted message will appear here..."></textarea>
                <button id="exportPdfButton" class="secondary-button">Export to PDF</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Made by Puchku ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
